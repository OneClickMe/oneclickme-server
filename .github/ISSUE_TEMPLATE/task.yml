name: "👻 Task"
description: 여러 하위 이슈를 묶어 관리하는 상위 이슈
title: "[Task] "
labels: [ ":ghost: Task" ]
body:
  - type: markdown
    attributes:
      value: |
        ## 👻 Task 이슈에 앞서
        Feature, Bug, Refactor, Chore, Docs 등 **여러 하위 이슈를 묶는 상위 작업**에 사용해주세요.
        개별 작업은 해당 유형의 이슈로 작성하고 Sub-Issue로 연결해주세요.

  - type: textarea
    id: description
    attributes:
      label: 어떤 작업인가요?
      description: 하위 이슈들을 묶는 작업의 목적과 범위를 작성해주세요.
      placeholder: |
        e.g. 장소 저장과 조회 기능을 구현하기 위해 API 개발과 API 문서 작성 이슈를 묶어 관리합니다.
    validations:
      required: true

  - type: textarea
    id: todo
    attributes:
      label: 🔧 TODO
      description: 하위 이슈와 완료할 작업을 체크리스트로 작성해주세요.
      placeholder: |
        e.g.
        - [ ] #12 장소 저장 API 구현
        - [ ] #13 장소 조회 API 구현
        - [ ] #14 장소 API 문서 작성
    validations:
      required: false

  - type: input
    id: related
    attributes:
      label: 🔗 관련 이슈
      description: 연관된 이슈가 있다면 번호를 입력해주세요.
      placeholder: "e.g. #123, #456"
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: ✅ 제출 전 확인사항
      options:
        - label: 동일하거나 유사한 이슈가 없는지 확인했습니다.
          required: true
        - label: 여러 하위 이슈를 묶어 관리하는 상위 작업임을 확인했습니다.
          required: true
        - label: 적절한 라벨과 Assignee를 설정했습니다.
          required: false
